name: CI/CD

on:
  push:
    branches: master
  pull_request:
    branches: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  Build:
    runs-on: windows-latest
    outputs:
      deploy: ${{ steps.set_output.outputs.deploy }}
      release: ${{ steps.set_output.outputs.release }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        show-progress: false
        fetch-depth: 0
    - name: Query dotnet version
      id: dotnet_version
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        dotnet --version
        if ($LASTEXITCODE -ne 0) {
          echo "setup_dotnet=true" >>$env:GITHUB_OUTPUT
          $LASTEXITCODE = 0
        }
    - name: Setup dotnet
      if: ${{ steps.dotnet_version.outputs.setup_dotnet }}
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: ./global.json
    - name: Build
      id: build
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        $env:MSBuildDebugEngine = 1
        $env:MSBUILDLOGTASKINPUTS = 1
        $env:MSBUILDDEBUGPATH = Join-Path $env:GITHUB_WORKSPACE 'artifacts/binlog'
        dotnet restore
        dotnet build ./docs/help/help.msbuildproj --no-restore
        dotnet build ./src/Mawosoft.PowerShell.WindowsSearchManager/Mawosoft.PowerShell.WindowsSearchManager.csproj -c Release --no-restore --no-dependencies
        dotnet build ./src/Mawosoft.PowerShell.WindowsSearchManager/Mawosoft.PowerShell.WindowsSearchManager.csproj -c Debug --no-restore --no-dependencies
        dotnet build ./tests/Mawosoft.PowerShell.WindowsSearchManager.Tests/Mawosoft.PowerShell.WindowsSearchManager.Tests.csproj -c Release --no-restore --no-dependencies
        dotnet build ./tests/Mawosoft.PowerShell.WindowsSearchManager.Tests/Mawosoft.PowerShell.WindowsSearchManager.Tests.csproj -c Debug --no-restore --no-dependencies
        dotnet build ./docs/docs.msbuildproj --no-restore -c Release
        dotnet pack ./src/Mawosoft.PowerShell.WindowsSearchManager/Mawosoft.PowerShell.WindowsSearchManager.csproj -c Release --no-build
    - name: Upload Binlogs
      if: ${{ failure() && steps.build.conclusion == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: Binlogs
        path: ./artifacts/binlog
        include-hidden-files: true
    - name: Upload Packages
      uses: actions/upload-artifact@v7
      with:
        name: Packages
        path: ./artifacts/package/release
    - name: Upload Docs Website
      uses: actions/upload-artifact@v7
      with:
        name: DocsWebsite
        path: ./artifacts/bin/docs/site
        include-hidden-files: true
    - name: Set Deployment and Release Outputs
      id: set_output
      if: ${{ github.event_name == 'push' }}
      run: |
        [string] $semver = '^(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?:-(?<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        $docElement = (select-xml -Path ./Directory.Build.props -XPath "/*").Node
        $version = (select-xml -Xml $docElement -XPath "//ns:Version" -Namespace @{ ns = $docElement.NamespaceURI }).Node.InnerText
        if ($version -cnotmatch $semver)
        {
            throw "Invalid Version property."
        }
        if ($Matches.prerelease) {
          $deploy = "Azure"
          $release = ""
        }
        else {
          $deploy = "Nuget"
          $release = "v$version"
        }
        Write-Host "Version: $version, Deploy: $deploy, Release: $release"
        echo "deploy=$deploy" >>$env:GITHUB_OUTPUT
        echo "release=$release" >>$env:GITHUB_OUTPUT
    - name: Test
      id: test
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $true
        # Both dotnet-coverage and Microsoft.CodeCoverage crash with .NET Framework versions.
        $msccConsole = Join-Path $env:ProgramFiles 'Microsoft Visual Studio/18/Enterprise/Common7/IDE/Extensions/Microsoft/CodeCoverage.Console/Microsoft.CodeCoverage.Console.exe'
        if (-not (Test-Path -LiteralPath $msccConsole)) {
          $msccConsole = $null
        }
        $argsCommon = @(
          'test', './tests/Mawosoft.PowerShell.WindowsSearchManager.Tests/Mawosoft.PowerShell.WindowsSearchManager.Tests.csproj'
          '--nologo', '--no-build', '--logger', 'trx'
          '--results-directory', './artifacts/TestResults'
          '--diag', './artifacts/TestResults/diag.log'
        )
        $argsCoverage = @(
          '--settings', './tests/Mawosoft.PowerShell.WindowsSearchManager.Tests/dotnet-coverage-settings.xml'
          '--output-format', 'cobertura'
          '--output'
        )
        $argsFilter = @(
          '--filter', 'WSearch=IsDisabled'
        )
        $coverageFiles = @()
        if ($msccConsole) {
          $coverageFiles += './artifacts/TestResults/coverage/debug_net10.0_WSearchDisabled.cobertura.xml'
          & $msccConsole collect dotnet $argsCommon $argsFilter --configuration Debug --framework net10.0 $argsCoverage $coverageFiles[-1]
          $coverageFiles += './artifacts/TestResults/coverage/debug_net48_WSearchDisabled.cobertura.xml'
          & $msccConsole collect dotnet $argsCommon $argsFilter --configuration Debug --framework net48 $argsCoverage $coverageFiles[-1]
        }
        else {
          dotnet $argsCommon $argsFilter --configuration Debug --framework net10.0
          dotnet $argsCommon $argsFilter --configuration Debug --framework net48
        }
        dotnet $argsCommon $argsFilter --configuration Release --framework net10.0
        dotnet $argsCommon $argsFilter --configuration Release --framework net48
        $argsFilter = @(
          '--filter', 'WSearch!=IsDisabled'
        )
        Set-Service wsearch -StartupType Automatic
        Start-Service wsearch
        if ($msccConsole) {
          $coverageFiles += './artifacts/TestResults/coverage/debug_net10.0_WSearchNotDisabled.cobertura.xml'
          & $msccConsole collect dotnet $argsCommon $argsFilter --configuration Debug --framework net10.0 $argsCoverage $coverageFiles[-1]
          $coverageFiles += './artifacts/TestResults/coverage/debug_net48_WSearchNotDisabled.cobertura.xml'
          & $msccConsole collect dotnet $argsCommon $argsFilter --configuration Debug --framework net48 $argsCoverage $coverageFiles[-1]
        }
        else {
          dotnet $argsCommon $argsFilter --configuration Debug --framework net10.0
          dotnet $argsCommon $argsFilter --configuration Debug --framework net48
        }
        dotnet $argsCommon $argsFilter --configuration Release --framework net10.0
        dotnet $argsCommon $argsFilter --configuration Release --framework net48
        if ($coverageFiles) {
          echo "files=$($coverageFiles -join ',')" >>$env:GITHUB_OUTPUT
        }
    - name: Upload Test Results
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: TestResults
        path: ./artifacts/TestResults
        include-hidden-files: true
    - name: Upload to codecov
      if: ${{ github.secret_source == 'Actions' && steps.test.outputs.files != '' }}
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ steps.test.outputs.files }}
        disable_search: true
        disable_telem: true
        verbose: false
        fail_ci_if_error: true

  Deploy:
    needs: Build
    if: ${{ needs.Build.outputs.deploy != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download Packages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: ./Packages/
    - name: Install Azure Credential Provider
      run: Invoke-Expression "& { $(Invoke-RestMethod https://aka.ms/install-artifacts-credprovider.ps1) }"
    - name: Deploy to Azure
      env:
        VSS_NUGET_EXTERNAL_FEED_ENDPOINTS: '{"endpointCredentials": [{"endpoint":"https://pkgs.dev.azure.com/mawosoft-de/public/_packaging/public/nuget/v3/index.json", "password":"${{ secrets.AZURE_PACKAGE_PAT }}"}]}'
      run: dotnet nuget push ./Packages/*.nupkg --skip-duplicate --source https://pkgs.dev.azure.com/mawosoft-de/public/_packaging/public/nuget/v3/index.json --api-key az

  Publish:
    needs: Build
    if: ${{ needs.Build.outputs.deploy == 'Nuget' }}
    runs-on: ubuntu-latest
    steps:
    - name: Download Packages
      uses: actions/download-artifact@v8
      with:
        name: Packages
        path: ./Packages/
    - name: Publish to Nuget
      run: dotnet nuget push ./Packages/*.nupkg --skip-duplicate --source https://www.powershellgallery.com/api/v2/package/ --api-key ${{ secrets.PSGALLERY_API_KEY }}

  Release:
    needs: Build
    if: ${{ needs.Build.outputs.release != '' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        show-progress: false
        fetch-depth: 1
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.Build.outputs.release }}
        generate_release_notes: false # false is default. Seems to draw from PRs only.
