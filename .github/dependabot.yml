# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      action-dependencies:
        patterns: 
          - '*'
  - package-ecosystem: "nuget"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      nuget-dependencies:
        patterns:
          - '*'
